name: wmbusmeters-pin-bump

# Weekly upstream-release check for the wmbusmeters build pin.
#
# The Dockerfile builds wmbusmeters from a fixed commit (ARG WMBUSMETERS_COMMIT,
# see the comment there and docs/ARCHITECTURE.md §12). This workflow runs every
# Monday, compares that pin against the latest upstream RELEASE TAG
# (X.Y.Z — deliberately not master HEAD), and opens a bump PR when upstream has
# published a new release.
#
# Merging the PR stays a human decision. Validation happens after the merge, on
# the push to main: build.yaml builds both arch images and runs decode-smoke
# (golden fixtures) + standalone-boot. The `bump` job depends on those, so a
# decode regression in the new wmbusmeters means config.yaml never advances and
# HA users never see the broken image — the same gate a manual pin bump gets.

on:
  schedule:
    # 05:17 UTC every Monday (odd minute to avoid load spikes).
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: wmbusmeters-pin-bump
  cancel-in-progress: false

jobs:
  check-and-pr:
    name: Check upstream release tag, open bump PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compare pin with latest upstream release tag
        id: check
        shell: bash
        run: |
          set -euo pipefail

          CURRENT="$(sed -nE 's/^ARG WMBUSMETERS_COMMIT=([0-9a-f]{40})[[:space:]]*$/\1/p' Dockerfile)"
          if [[ -z "${CURRENT}" ]]; then
            echo "ERROR: cannot read ARG WMBUSMETERS_COMMIT from Dockerfile" >&2
            exit 1
          fi
          echo "Current pin: ${CURRENT}"

          git ls-remote --tags https://github.com/wmbusmeters/wmbusmeters.git > /tmp/upstream-tags

          # Release tags only (X.Y.Z, optional v prefix); sort -V picks the highest.
          LATEST_TAG="$(awk '{print $2}' /tmp/upstream-tags \
            | sed -nE 's#^refs/tags/(v?[0-9]+\.[0-9]+\.[0-9]+)(\^\{\})?$#\1#p' \
            | sort -uV | tail -n1)"
          if [[ -z "${LATEST_TAG}" ]]; then
            echo "ERROR: no X.Y.Z release tags found upstream" >&2
            exit 1
          fi

          # Annotated tags: the peeled ^{} entry is the tagged commit.
          # Lightweight tags have no ^{} entry — the plain ref IS the commit.
          SHA="$(awk -v r="refs/tags/${LATEST_TAG}^{}" '$2 == r { print $1 }' /tmp/upstream-tags)"
          if [[ -z "${SHA}" ]]; then
            SHA="$(awk -v r="refs/tags/${LATEST_TAG}" '$2 == r { print $1 }' /tmp/upstream-tags)"
          fi
          echo "Latest upstream release: ${LATEST_TAG} (${SHA})"

          if [[ "${SHA}" == "${CURRENT}" ]]; then
            echo "Pin already at the latest release — nothing to do."
            echo "bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH="ci/bump-wmbusmeters-${LATEST_TAG}"
          if git ls-remote --exit-code origin "refs/heads/${BRANCH}" > /dev/null 2>&1; then
            echo "Branch ${BRANCH} already exists (bump PR presumably open) — nothing to do."
            echo "bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "bump=true"
            echo "tag=${LATEST_TAG}"
            echo "sha=${SHA}"
            echo "branch=${BRANCH}"
          } >> "$GITHUB_OUTPUT"

      - name: Open bump PR
        if: steps.check.outputs.bump == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.check.outputs.tag }}
          SHA: ${{ steps.check.outputs.sha }}
          BRANCH: ${{ steps.check.outputs.branch }}
        run: |
          set -euo pipefail

          sed -i -E "s/^(ARG WMBUSMETERS_COMMIT=)[0-9a-f]{40}[[:space:]]*$/\1${SHA}/" Dockerfile
          if git diff --quiet -- Dockerfile; then
            echo "ERROR: sed did not change the pin line in Dockerfile" >&2
            exit 1
          fi

          cat > /tmp/commit-msg.txt <<EOF
          chore: bump pinned wmbusmeters to ${TAG} (${SHA:0:8})

          Automated weekly pin check (wmbusmeters-pin-bump.yml): upstream
          published release tag ${TAG}; WMBUSMETERS_COMMIT moves to the tagged
          commit ${SHA}. Only the ARG line changes — validation happens on the
          push to main after merge (decode-smoke golden fixtures +
          standalone-boot gate the version bump).
          EOF

          cat > /tmp/pr-body.md <<EOF
          Automated weekly pin check: upstream published release tag \`${TAG}\`.

          \`WMBUSMETERS_COMMIT\` moves to the tagged commit \`${SHA}\`.

          **Validation model** (docs/ARCHITECTURE.md §12): merging triggers the
          push-to-main CI — both arch builds, the decode-smoke golden fixtures and
          the standalone boot-test. The \`bump\` job depends on all of them, so a
          decode regression in the new wmbusmeters keeps \`config.yaml\` at the
          previous version and no broken image is ever published to HA users.

          **Before merging**: skim the upstream changelog for ${TAG} and refresh the
          prose comment above the ARG in the Dockerfile (it documents the current
          pin and why).
          EOF

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add Dockerfile
          git commit -F /tmp/commit-msg.txt
          git push origin "${BRANCH}"

          # Assign the repo owner so the bump PR triggers a direct
          # "participating" notification (email). PRs opened by the default
          # GITHUB_TOKEN / github-actions[bot] do not reliably notify watchers,
          # but an assignment does — it is a direct participation event.
          gh pr create \
            --base main \
            --head "${BRANCH}" \
            --assignee Kustonium \
            --title "chore: bump pinned wmbusmeters to ${TAG} (${SHA:0:8})" \
            --body-file /tmp/pr-body.md
