name: build-addon-dev

on:
  push:
    branches:
      - main
    paths:
      - 'rootfs/**'
      - 'Dockerfile'
      - 'config.yaml'
      - 'translations/**'
      - 'tests/**'
      - 'docker/**'
      - '.github/workflows/build.yaml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: build-addon-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ---------------------------------------------------------------------------
  # Gate — decide once whether this push needs an image rebuild. The `skip`
  # output is honoured by both build and bump jobs, so docs-only pushes do
  # nothing (no build, no version bump).
  # ---------------------------------------------------------------------------
  gate:
    name: Gate (path-aware)
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: the gate diffs the WHOLE push range (event.before),
          # which can be arbitrarily many commits behind HEAD.
          fetch-depth: 0

      - name: Gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "manual dispatch — building"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Diff the whole push range, not HEAD~1..HEAD. A multi-commit push
          # ending with a docs-only commit used to skip the build even though
          # an earlier commit in the same push touched rootfs/ — the image
          # silently never shipped (observed: a prefix-check fix followed by
          # a handoff commit produced Gate=skip and no version bump).
          BASE="${{ github.event.before }}"
          if [[ -z "${BASE}" ]] || [[ "${BASE}" =~ ^0+$ ]] || ! git cat-file -e "${BASE}" 2>/dev/null; then
            echo "no usable push base (new branch / forced push) — building defensively"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED="$(git diff --name-only "${BASE}" HEAD 2>/dev/null || true)"
          if [[ -z "${CHANGED}" ]]; then
            echo "cannot determine changed files — building defensively"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Files changed in this push:"
          echo "${CHANGED}" | sed 's/^/  /'

          PATTERN="^(rootfs/|Dockerfile|config\.yaml|translations/|tests/|docker/|\.github/workflows/build\.yaml$)"
          if echo "${CHANGED}" | grep -qE "${PATTERN}"; then
            echo "image-affecting change — building"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "no image-affecting changes (README/CHANGELOG/etc only) — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  static-tests:
    name: Static regression tests
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run static regression tests
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test_driver_catalog_contract.sh
          bash tests/test_discovery_publish_order.sh

  # ---------------------------------------------------------------------------
  # Build — build + push BOTH arch images tagged :dev and :dev.<run_number>.
  # Crucially this job does NOT commit the version. The version is only written
  # to config.yaml afterwards by the `bump` job, and only if every arch image
  # was pushed. A failed build therefore never leaves config.yaml pointing at a
  # version whose image is missing in GHCR (the "image doesn't exist" bug).
  # ---------------------------------------------------------------------------
  build:
    name: Build wmbus_mqtt_bridge_dev (${{ matrix.arch }})
    needs: [gate, static-tests]
    if: needs.gate.outputs.skip != 'true'
    runs-on: ${{ matrix.runs_on }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            base_image: ghcr.io/home-assistant/amd64-base:3.20
            runs_on: ubuntu-latest
          - arch: aarch64
            platform: linux/arm64
            base_image: ghcr.io/home-assistant/aarch64-base:3.20
            runs_on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare build variables
        shell: bash
        run: |
          set -euo pipefail
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

          CFG="config.yaml"
          RAW_VER="$(sed -nE 's/^version:[[:space:]]*"?([^"[:space:]]+)"?[[:space:]]*$/\1/p' "${CFG}" | head -n1)"
          if [[ -z "${RAW_VER}" ]]; then
            echo "ERROR: cannot read version from ${CFG}"
            exit 1
          fi
          CORE_VER="$(echo "${RAW_VER}" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')"
          if [[ -z "${CORE_VER}" ]]; then
            echo "ERROR: cannot derive core X.Y.Z from version '${RAW_VER}'"
            exit 1
          fi
          VER="${CORE_VER}-dev.${{ github.run_number }}"
          echo "ADDON_VERSION=${VER}" >> "$GITHUB_ENV"
          echo "Building dev version ${VER} (arch=${{ matrix.arch }})"

      - name: Check GHCR token
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${{ secrets.GHCR_TOKEN }}" ]]; then
            echo "ERROR: missing repository secret GHCR_TOKEN (PAT with read:packages and write:packages)."
            exit 1
          fi

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: Kustonium
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --progress=plain \
            --platform ${{ matrix.platform }} \
            --build-arg BUILD_FROM=${{ matrix.base_image }} \
            --build-arg ADDON_VERSION=${ADDON_VERSION} \
            --push \
            -t ghcr.io/${OWNER_LC}/${{ matrix.arch }}-addon-wmbus_mqtt_bridge-dev:dev \
            -t ghcr.io/${OWNER_LC}/${{ matrix.arch }}-addon-wmbus_mqtt_bridge-dev:${ADDON_VERSION} \
            -f Dockerfile \
            .

  # ---------------------------------------------------------------------------
  # Decode smoke-test — pipe the golden HEX fixtures through the freshly
  # built amd64 image (wmbusmeters stdin:hex) and compare the JSON against
  # committed golden files (tests/fixtures/golden.tsv). Guards
  # WMBUSMETERS_COMMIT bumps in the Dockerfile: a bump that renames fields
  # or breaks decoding of a known telegram fails here, and the version is
  # never bumped (bump needs this job). All current fixtures are public
  # (upstream driver test telegrams and the public replay corpus), so the
  # AES key in golden.tsv is upstream's published test key. To add a
  # fixture with a PRIVATE key: put an env var name in the key column,
  # add the key as a repository secret and pass it through to docker run
  # via -e (never commit private keys or echo them to the log).
  # ---------------------------------------------------------------------------
  decode-smoke:
    name: Decode smoke-test (golden fixtures)
    needs: [gate, build]
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: Kustonium
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Run golden decode fixtures in the built image
        shell: bash
        env:
          # "1" = a fixture without a committed golden .json file is a
          # failure. Set to "0" only while bootstrapping new fixtures
          # (the job then prints the proposed golden instead of failing).
          GOLDEN_REQUIRE: "1"
        run: |
          set -euo pipefail
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          CFG="config.yaml"
          RAW_VER="$(sed -nE 's/^version:[[:space:]]*"?([^"[:space:]]+)"?[[:space:]]*$/\1/p' "${CFG}" | head -n1)"
          CORE_VER="$(echo "${RAW_VER}" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')"
          VER="${CORE_VER}-dev.${{ github.run_number }}"
          IMG="ghcr.io/${OWNER_LC}/amd64-addon-wmbus_mqtt_bridge-dev:${VER}"
          echo "Testing image ${IMG}"
          docker run --rm \
            -v "${PWD}/tests:/smoke:ro" \
            -e GOLDEN_REQUIRE \
            --entrypoint /bin/bash \
            "${IMG}" \
            /smoke/test_decode_smoke.sh

  # ---------------------------------------------------------------------------
  # Standalone boot-test — start the freshly built amd64 image the way the
  # documented Docker-standalone deployment does (docker/examples/
  # docker-compose.yml): default entrypoint /usr/bin/docker-entrypoint.sh,
  # next to an anonymous Mosquitto broker reachable as host "mosquitto"
  # (which is exactly what the entrypoint's generated default options.json
  # points at). Nobody runs this mode by hand and it has drifted before
  # (docs/ARCHITECTURE.md §11), so CI asserts the minimum boot contract:
  #   1. the entrypoint generated /config/options.json,
  #   2. bridge.sh started and connected to the test broker,
  #   3. the container is still running after the grace period.
  # The bump job needs this, so a broken standalone boot blocks the version
  # bump the same way a decode regression does.
  # ---------------------------------------------------------------------------
  standalone-boot:
    name: Standalone boot-test (docker-entrypoint.sh)
    needs: [gate, build]
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: Kustonium
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Boot standalone container against a test broker
        shell: bash
        run: |
          set -euo pipefail
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          CFG="config.yaml"
          RAW_VER="$(sed -nE 's/^version:[[:space:]]*"?([^"[:space:]]+)"?[[:space:]]*$/\1/p' "${CFG}" | head -n1)"
          CORE_VER="$(echo "${RAW_VER}" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')"
          VER="${CORE_VER}-dev.${{ github.run_number }}"
          IMG="ghcr.io/${OWNER_LC}/amd64-addon-wmbus_mqtt_bridge-dev:${VER}"
          echo "Booting standalone container from ${IMG}"

          docker network create wmbus-standalone

          # Same broker image and config as the documented compose example.
          docker run -d --name mosquitto --network wmbus-standalone \
            -v "${PWD}/docker/examples/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro" \
            eclipse-mosquitto:2

          # No /config volume on purpose: a fresh container must generate the
          # default options.json itself (external_mqtt_host = "mosquitto").
          docker run -d --name wmbus --network wmbus-standalone \
            --entrypoint /usr/bin/docker-entrypoint.sh \
            "${IMG}"

          # bridge.sh retries the broker every 2 s (wait_for_mqtt), so this
          # comfortably covers a slow Mosquitto start.
          sleep 20

          LOGS="$(docker logs wmbus 2>&1 || true)"
          echo "----- wmbus container logs -----"
          echo "${LOGS}"
          echo "--------------------------------"

          fail=0
          if ! grep -qF "Created default /config/options.json" <<<"${LOGS}"; then
            echo "FAIL: entrypoint did not generate /config/options.json"
            fail=1
          fi
          if ! grep -qF "Starting core bridge" <<<"${LOGS}"; then
            echo "FAIL: entrypoint did not hand over to bridge.sh"
            fail=1
          fi
          if ! grep -qF "MQTT broker ready" <<<"${LOGS}"; then
            echo "FAIL: bridge.sh did not connect to the test broker"
            fail=1
          fi
          if [[ "$(docker inspect -f '{{.State.Running}}' wmbus)" != "true" ]]; then
            echo "FAIL: container exited (code $(docker inspect -f '{{.State.ExitCode}}' wmbus))"
            echo "----- mosquitto logs (tail) -----"
            docker logs mosquitto 2>&1 | tail -n 20 || true
            fail=1
          fi
          exit ${fail}

  # ---------------------------------------------------------------------------
  # Bump — runs ONLY after BOTH arch images were pushed successfully AND the
  # decode smoke-test AND the standalone boot-test passed (needs: build +
  # decode-smoke + standalone-boot). Writes the just-built version into
  # config.yaml so Home Assistant never sees a version that has no image.
  # If any arch build or either smoke-test failed, this job is skipped and
  # config.yaml keeps pointing at the previous, still-available image.
  # ---------------------------------------------------------------------------
  bump:
    name: Bump dev version in config.yaml
    needs: [gate, build, decode-smoke, standalone-boot]
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Bump version and push
        shell: bash
        run: |
          set -euo pipefail
          CFG="config.yaml"
          RAW_VER="$(sed -nE 's/^version:[[:space:]]*"?([^"[:space:]]+)"?[[:space:]]*$/\1/p' "${CFG}" | head -n1)"
          CORE_VER="$(echo "${RAW_VER}" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')"
          NEW_VER="${CORE_VER}-dev.${{ github.run_number }}"
          echo "Bumping dev version: ${RAW_VER} → ${NEW_VER}"
          sed -i -E "s/^(version:[[:space:]]*\").*\"/\1${NEW_VER}\"/" "${CFG}"

          if git diff --quiet -- "${CFG}"; then
            echo "config.yaml already at ${NEW_VER} — nothing to commit."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${CFG}"
          git commit -m "ci(dev): bump version to ${NEW_VER} [skip ci]"
          git pull --rebase origin main
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
