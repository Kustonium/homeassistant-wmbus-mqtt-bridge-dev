name: build-addon-dev

on:
  push:
    branches:
      - main
    paths:
      - 'rootfs/**'
      - 'Dockerfile'
      - 'config.yaml'
      - 'translations/**'
      - '.github/workflows/build.yaml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: build-addon-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ---------------------------------------------------------------------------
  # Gate — decide once whether this push needs an image rebuild. The `skip`
  # output is honoured by both build and bump jobs, so docs-only pushes do
  # nothing (no build, no version bump).
  # ---------------------------------------------------------------------------
  gate:
    name: Gate (path-aware)
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "manual dispatch — building"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED="$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)"
          if [[ -z "${CHANGED}" ]]; then
            echo "cannot determine changed files — building defensively"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Files changed in this push:"
          echo "${CHANGED}" | sed 's/^/  /'

          PATTERN="^(rootfs/|Dockerfile|config\.yaml|translations/|\.github/workflows/build\.yaml$)"
          if echo "${CHANGED}" | grep -qE "${PATTERN}"; then
            echo "image-affecting change — building"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "no image-affecting changes (README/CHANGELOG/etc only) — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Build — build + push BOTH arch images tagged :dev and :dev.<run_number>.
  # Crucially this job does NOT commit the version. The version is only written
  # to config.yaml afterwards by the `bump` job, and only if every arch image
  # was pushed. A failed build therefore never leaves config.yaml pointing at a
  # version whose image is missing in GHCR (the "image doesn't exist" bug).
  # ---------------------------------------------------------------------------
  build:
    name: Build wmbus_mqtt_bridge_dev (${{ matrix.arch }})
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ${{ matrix.runs_on }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            base_image: ghcr.io/home-assistant/amd64-base:3.20
            runs_on: ubuntu-latest
          - arch: aarch64
            platform: linux/arm64
            base_image: ghcr.io/home-assistant/aarch64-base:3.20
            runs_on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare build variables
        shell: bash
        run: |
          set -euo pipefail
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

          CFG="config.yaml"
          RAW_VER="$(sed -nE 's/^version:[[:space:]]*"?([^"[:space:]]+)"?[[:space:]]*$/\1/p' "${CFG}" | head -n1)"
          if [[ -z "${RAW_VER}" ]]; then
            echo "ERROR: cannot read version from ${CFG}"
            exit 1
          fi
          CORE_VER="$(echo "${RAW_VER}" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')"
          if [[ -z "${CORE_VER}" ]]; then
            echo "ERROR: cannot derive core X.Y.Z from version '${RAW_VER}'"
            exit 1
          fi
          VER="${CORE_VER}-dev.${{ github.run_number }}"
          echo "ADDON_VERSION=${VER}" >> "$GITHUB_ENV"
          echo "Building dev version ${VER} (arch=${{ matrix.arch }})"

      - name: Check GHCR token
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${{ secrets.GHCR_TOKEN }}" ]]; then
            echo "ERROR: missing repository secret GHCR_TOKEN (PAT with read:packages and write:packages)."
            exit 1
          fi

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: Kustonium
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --progress=plain \
            --platform ${{ matrix.platform }} \
            --build-arg BUILD_FROM=${{ matrix.base_image }} \
            --build-arg ADDON_VERSION=${ADDON_VERSION} \
            --push \
            -t ghcr.io/${OWNER_LC}/${{ matrix.arch }}-addon-wmbus_mqtt_bridge-dev:dev \
            -t ghcr.io/${OWNER_LC}/${{ matrix.arch }}-addon-wmbus_mqtt_bridge-dev:${ADDON_VERSION} \
            -f Dockerfile \
            .

  # ---------------------------------------------------------------------------
  # Bump — runs ONLY after BOTH arch images were pushed successfully
  # (needs: build, which waits for every matrix leg). Writes the just-built
  # version into config.yaml so Home Assistant never sees a version that has
  # no image. If any arch build failed, this job is skipped and config.yaml
  # keeps pointing at the previous, still-available image.
  # ---------------------------------------------------------------------------
  bump:
    name: Bump dev version in config.yaml
    needs: [gate, build]
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bump version and push
        shell: bash
        run: |
          set -euo pipefail
          CFG="config.yaml"
          RAW_VER="$(sed -nE 's/^version:[[:space:]]*"?([^"[:space:]]+)"?[[:space:]]*$/\1/p' "${CFG}" | head -n1)"
          CORE_VER="$(echo "${RAW_VER}" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')"
          NEW_VER="${CORE_VER}-dev.${{ github.run_number }}"
          echo "Bumping dev version: ${RAW_VER} → ${NEW_VER}"
          sed -i -E "s/^(version:[[:space:]]*\").*\"/\1${NEW_VER}\"/" "${CFG}"

          if git diff --quiet -- "${CFG}"; then
            echo "config.yaml already at ${NEW_VER} — nothing to commit."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${CFG}"
          git commit -m "ci(dev): bump version to ${NEW_VER} [skip ci]"
          git pull --rebase origin main
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
